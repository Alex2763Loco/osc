<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WOTOSC</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">

  <!-- Scripts de Firebase obligatorios (v8 compat) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

  <!-- Capa del fondo animado -->
  <div class="background-pattern"></div>

  <header>
    <div class="header-top">
      <h1>WOTOSC</h1>
      <button id="theme-toggle" class="theme-btn">☀️ Modo Claro</button>
      
      <!-- Botón entrar si está desconectado -->
      <button id="login-btn" class="theme-btn">🔑 Entrar con Google</button>
      
      <!-- Contenedor de Perfil -->
      <div id="user-profile" style="display: flex; align-items: center; gap: 8px; margin: 0 10px;">
        
        <!-- Input oculto para abrir el explorador de archivos -->
        <input type="file" id="avatar-input" accept="image/*" style="display: none;" onchange="changeAvatar(event)">
        
        <!-- Foto de perfil (Al hacer clic abre el explorador de archivos) -->
        <img id="user-avatar" src="profile_match.png" alt="Perfil" onclick="document.getElementById('avatar-input').click()" style="width: 34px; height: 34px; border-radius: 50%; object-fit: cover; cursor: pointer; border: 2px solid #00ff66;" title="Haz clic para cambiar foto">
        
        <!-- Nombre de usuario desplegado -->
        <span id="user-name-display" onclick="toggleNameEdit()" style="cursor: pointer; color: #00ff66; font-weight: bold; font-size: 15px;" title="Haz clic para cambiar nombre">MiUsuario</span>
        
        <!-- Campo de texto y Botón Guardar -->
        <div id="edit-name-container" style="display: none; align-items: center; gap: 4px;">
          <input type="text" id="user-name-edit" style="background: #222; color: #00ff66; border: 1px solid #00ff66; border-radius: 4px; padding: 2px 6px; font-size: 14px; font-weight: bold;">
          <button onclick="saveCustomName()" class="theme-btn" style="padding: 2px 8px; font-size: 12px; cursor: pointer;">Guardar</button>
        </div>
      </div>

      <button id="logout-btn" class="theme-btn" style="display: none;">Cerrar sesión</button>

      <!-- Botón para abrir la barra lateral derecha -->
      <button id="sidebar-toggle-btn" class="sidebar-toggle-btn" title="Abrir menú">☰</button>
    </div>
    <p>¡El archivo definitivo de BFDI, II, ONE Y más!</p>
  </header>

  <!-- Fondo oscuro translúcido para el menú lateral -->
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <!-- Barra Lateral Derecha -->
  <aside id="right-sidebar" class="right-sidebar">
    <div class="sidebar-header">
      <h2>Menú</h2>
      <button id="sidebar-close-btn" class="sidebar-close-btn">&times;</button>
    </div>

    <div class="sidebar-content">
      <!-- Sección de Cuenta / Usuario dentro del Sidebar -->
      <div class="sidebar-section">
        <h3>Cuenta</h3>
        <div id="sidebar-user-info" class="sidebar-user-info">
          <!-- Se rellena dinámicamente desde JS -->
        </div>
      </div>

      <!-- Sección de Configuraciones -->
      <div class="sidebar-section">
        <h3>Configuración</h3>
        <button id="sidebar-theme-toggle" class="sidebar-option-btn">
          ☀️ Cambiar Tema (Claro/Oscuro)
        </button>
        
        <!-- Control de Volumen -->
        <div class="sidebar-volume-control" style="margin-top: 10px;">
          <label for="volume-slider" style="display: block; margin-bottom: 5px;">🔊 Volumen de Interfaz:</label>
          <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.15" style="width: 100%; cursor: pointer;">
        </div>
      </div>

      <!-- Más opciones -->
      <div class="sidebar-section">
        <h3>Más opciones</h3>
        <button class="sidebar-option-btn" onclick="currentFilter='favs'; applyFilters(); closeSidebar();">⭐ Ver Favoritos</button>
      </div>
    </div>
  </aside>

  <div class="controls-container">
    <div class="search-box">
      <input type="text" id="search-input" placeholder="🔍 Buscar episodios por título...">
    </div>

    <div class="filter-container">
      <button class="filter-btn active" data-show="all">Todos</button>
      <button class="filter-btn favorites-btn" data-show="favs">★ Favoritos</button>
      <button class="filter-btn" data-show="BFDI">BFDI</button>
      <button class="filter-btn" data-show="II">II</button>
      <button class="filter-btn" data-show="ONE">ONE</button>
      <button class="filter-btn" data-show="AB">AB</button>
      <button class="filter-btn" data-show="BS">BS</button>
      <button class="filter-btn" data-show="TNM">TNM</button>
      <button class="filter-btn" data-show="OF">OF</button>
      <button class="filter-btn" data-show="ITFT">ITFT</button>
    </div>
  </div>

  <main id="episodes-container" class="grid-container">
  </main>

  <script src="app.js"></script>
</body>
</html>
