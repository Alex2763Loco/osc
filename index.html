<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WOTOSC</title>
  <link rel="stylesheet" href="styles.css">

  <!-- Scripts de Firebase obligatorios (v8 compat) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

  <!-- Capa del fondo animado -->
  <div class="background-pattern"></div>

<header>
    <div class="header-top">
      <h1>WOTOSC</h1>
      <button id="theme-toggle" class="theme-btn">☀️ Modo Claro</button>
      
      <!-- Botones y perfil de sesión -->
      <button id="login-btn" class="theme-btn">🔑 Entrar con Google</button>
      
      <div id="user-profile" style="display: flex; align-items: center; gap: 8px;">
        <img id="user-avatar" src="profile_match.png" alt="Perfil" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover; display: none;">
        <span id="user-name-display" onclick="toggleNameEdit()" style="cursor: pointer; color: var(--accent-color); font-weight: bold;" title="Haz clic para cambiar nombre"></span>
        <input type="text" id="user-name-edit" style="display: none; background: #222; color: var(--accent-color); border: 1px solid var(--accent-color); border-radius: 4px; padding: 2px 6px; font-size: 14px;">
      </div>

      <button id="logout-btn" class="theme-btn" style="display: none;">Cerrar sesión</button>
    </div>
    <p>¡El archivo definitivo de BFDI, II, ONE Y más!</p>
  </header>

  <div class="controls-container">
    <div class="search-box">
      <input type="text" id="search-input" placeholder="🔍 Buscar episodios por título...">
    </div>

    <div class="filter-container">
      <button class="filter-btn active" data-show="all">Todos</button>
      <button class="filter-btn favorites-btn" data-show="favs">★ Favoritos</button>
      <button class="filter-btn" data-show="BFDI">BFDI</button>
      <button class="filter-btn" data-show="II">II</button>
      <button class="filter-btn" data-show="ONE">ONE</button>
      <button class="filter-btn" data-show="AB">AB</button>
      <button class="filter-btn" data-show="BS">BS</button>
      <button class="filter-btn" data-show="TNM">TNM</button>
      <button class="filter-btn" data-show="OF">OF</button>
      <button class="filter-btn" data-show="ITFT">ITFT</button>
    </div>
  </div>

  <main id="episodes-container" class="grid-container">
  </main>

  <script src="app.js"></script>
</body>
</html>
